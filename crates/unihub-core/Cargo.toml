[package]
name = "unihub-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for UniHub, a native launcher and installer for Unity editors"

[lib]
name = "unihub_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs = "7"
plist = "1"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
# Reads the official Hub's project list in `hub.db`. Links the SQLite that ships with
# macOS (no `bundled` feature), so the app does not carry its own copy.
rusqlite = { version = "0.42", default-features = false }
tempfile = "3"
