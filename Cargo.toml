[workspace]
resolver = "3"
members = ["crates/unihub-core", "crates/unihub-cli", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
